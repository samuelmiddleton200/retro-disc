<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- no zooming; the game fills the screen -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- opened from the home screen: no Safari bars, black status bar -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- black-translucent: the page always runs under the status bar area, so iOS has no bar-sized strip to
     leave behind when the app opens sideways (the game already keeps clear of the notch itself) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Retro Disc">
<meta name="theme-color" content="#0b1433">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}   /* no bounce, no double-tap zoom */
  /* like an app: the page itself never moves; long menus scroll inside the game area.
     The page is pinned to the screen (position:fixed) so it cannot sit scrolled or pushed off to one side, and its
     height comes from --app-h, the size the script below measures, because an iPhone opened sideways sometimes
     hands the page a stale size or offset for a moment (the "whole screen shifted over" launch). */
  html,body{position:fixed;left:0;top:0;width:100%;height:100%;height:var(--app-h,100%);overflow:hidden}
  #ui{height:100%;height:100dvh;height:var(--app-h,100dvh);min-height:0 !important;overflow:hidden;overscroll-behavior:none}
  #game{height:var(--app-h,100%);bottom:auto !important}
  /* the stats list is the only screen allowed to scroll, and only up and down */
  #ui[data-screen="leaders"]{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
</style>
<script>
  // Launch guard for the shifted screen: measure the real screen, pin the page to it, put the page back at 0,0,
  // and if the iPhone is still reporting a stale size make it measure again. Runs at launch, a few more times in
  // the first seconds, and whenever the app comes back, rotates or resizes. It never reloads the app.
  (function(){
    var root = document.documentElement, nudges = 0, last = '';
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = function(){ return navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches); };
    var angle = function(){ var a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : window.orientation; return typeof a === 'number' ? Math.abs(a) % 180 : null; };
    // what the screen really is: on an iPhone home-screen app that is the whole display, turned the way the phone is held
    function real(){
      var w = window.innerWidth, h = window.innerHeight, a = angle();
      if (ios && standalone() && a !== null && screen.width && screen.height) {
        var long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
        var ew = a === 90 ? long : short, eh = a === 90 ? short : long;
        // only a big gap is a stale size (the page still thinks the phone is the other way up); small gaps are real bars
        if (Math.abs(w - ew) > 60 || Math.abs(h - eh) > 60) return { w:ew, h:eh, stale:true };
      }
      return { w:w, h:h, stale:false };
    }
    function settle(){
      try {
        var r = real(), vv = window.visualViewport;
        root.style.setProperty('--app-h', r.h + 'px');
        var moved = window.scrollX || window.scrollY || root.scrollTop || (document.body && document.body.scrollTop) || (vv && (vv.offsetTop || vv.offsetLeft || vv.pageTop || vv.pageLeft));
        if (moved) { window.scrollTo(0, 0); root.scrollTop = 0; if (document.body) document.body.scrollTop = 0; }
        if ((r.stale || moved) && nudges < 6) {                      // make the iPhone lay the page out again
          nudges++;
          var m = document.querySelector('meta[name=viewport]'), c = m && m.getAttribute('content');
          if (m) { m.setAttribute('content', c + ', height=device-height'); setTimeout(function(){ m.setAttribute('content', c); }, 60); }
        }
        var key = r.w + 'x' + r.h + (r.stale ? 's' : '') + (moved ? 'm' : '');
        if (key !== last) { last = key; setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 80); }   // the game re-fits its court
      } catch (e) {}
    }
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    settle();
    [0, 60, 150, 300, 600, 1000, 1600, 2500, 4000].forEach(function(ms){ setTimeout(settle, ms); });
    ['DOMContentLoaded', 'load', 'pageshow', 'resize', 'orientationchange', 'focus'].forEach(function(ev){ window.addEventListener(ev, function(){ settle(); setTimeout(settle, 250); setTimeout(settle, 700); }); });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) { nudges = 0; settle(); setTimeout(settle, 250); setTimeout(settle, 700); } });
    if (window.visualViewport) { visualViewport.addEventListener('resize', settle); visualViewport.addEventListener('scroll', settle); }
  })();
</script>
<script>
  // No surprise updates: the app never reloads itself. A new version (only when we publish one) shows the
  // next time the app is closed and opened again, because the game loads fresh from the server at launch.
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).catch(() => {}));
</script>
<title>Retro Disc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  --blue:#2f5fd8; --blue-d:#2149b4; --blue-dd:#17348a; --navy:#0f1f55;
  --white:#ffffff; --yellow:#ffd23f; --yellow-d:#c99a12; --red:#e24b3b; --green:#44c45d; --gray:#4d525e; --gray-d:#383c46;
  --px:"Silkscreen","Courier New",monospace;
  --numf:"Roboto Mono",ui-monospace,Consolas,monospace;
  --body:"Pixelify Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--blue);color:var(--white);height:100%}
body{margin:0;font:15px/1.3 var(--body);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.px{font-family:var(--px)}
#ui{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:10px 16px;min-height:100%}

/* --- chrome --- */
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-bottom:10px}
.box{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);padding:4px 10px;font-family:var(--px);font-weight:700;font-size:14px;white-space:nowrap}
.title{font-family:var(--px);font-weight:700;font-size:clamp(18px,3.4vw,28px);text-align:center;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;text-shadow:0 3px 0 var(--navy)}
.title .st{color:var(--yellow);font-size:.7em;vertical-align:.12em;letter-spacing:0}
.btn{font-family:var(--px);font-weight:700;text-transform:uppercase;border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);padding:9px 14px;font-size:14px;letter-spacing:.03em;box-shadow:0 4px 0 var(--navy)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.btn.go{background:var(--yellow);color:#241a00;border-color:#fff3b8}
.btn.red{background:var(--red)}
.btn.green{background:var(--green);color:#082010}
.btn.sm{padding:5px 9px;font-size:12px;border-width:2px}
.btn:disabled{opacity:.4;pointer-events:none}
.icon{width:40px;height:36px;padding:0;display:grid;place-items:center;font-size:18px}
.panel{border:3px solid var(--white);border-radius:6px;background:var(--blue-d);padding:10px 12px}
.label{font-family:var(--px);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#cfe0ff}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:10px}
.muted{color:#cfe0ff}
.yellow{color:var(--yellow)} .good{color:#7dff95} .bad{color:#ffb3aa}
.debt{color:#ff5e4f !important}                                                  /* cash below zero */
/* numbers use a plain monospace: the pixel fonts' 5 reads as S and 0 as O */
.num,.sal,.card .age{font-family:var(--numf);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:0}
.stars{color:var(--yellow);letter-spacing:1px;text-shadow:1px 1px 0 #6b4a00}
.stars .off{color:#8c93a3;text-shadow:none}
.stars .half{position:relative;display:inline-block;color:#8c93a3;text-shadow:none}
.stars .half::before{content:'★';position:absolute;left:0;top:0;width:50%;overflow:hidden;color:var(--yellow);text-shadow:1px 1px 0 #6b4a00}

/* --- hub --- */
.hub{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.menu .btn{padding:14px 6px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.chip{border:3px solid var(--white);border-radius:6px;background:var(--blue-dd);padding:5px 6px;text-align:center}
.chip b{display:block;font-family:var(--px);font-size:14px}
.vs{display:flex;align-items:center;justify-content:space-around;gap:6px;margin:6px 0 10px;text-align:center}
.vs .t{display:grid;justify-items:center;gap:3px}
.vs .n{font-family:var(--px);font-size:12px;text-transform:uppercase}
.badge{width:46px;height:46px;border-radius:6px;display:grid;place-items:center;font-family:var(--px);font-weight:700;font-size:13px;border:3px solid;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.badge.sm{width:28px;height:28px;font-size:9px;border-width:2px}

/* --- cards --- */
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.card{border:3px solid var(--white);border-radius:6px;overflow:hidden;background:var(--gray);padding:0;text-align:center;box-shadow:0 4px 0 var(--navy);position:relative}
.card:active{transform:translateY(2px)}
.card .top{height:62px;position:relative;display:flex;align-items:flex-end;justify-content:center}
.card .top img{width:56px;height:56px;image-rendering:pixelated}
.card .pos{position:absolute;left:4px;top:3px;font-family:var(--px);font-weight:700;font-size:12px;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.card .age{position:absolute;right:4px;top:4px;font-family:var(--px);font-size:10px;background:rgba(0,0,0,.3);border-radius:3px;padding:1px 3px}
.card .bot{padding:4px 3px 5px;border-top:3px solid var(--white)}
.card .nm{font-family:var(--px);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .fa-x{display:grid;gap:1px;margin-top:4px;font-size:12px;line-height:1.3}
.card .fa-x div{display:flex;justify-content:space-between;gap:4px;white-space:nowrap}
.card .fa-x span{color:#cfe0ff}
.card .fa-x b{color:var(--white);font-size:12px}
.card .fa-x .sh{display:none}                                       /* short labels, for narrow phone cards */
.card .fnm{font-family:var(--px);font-size:9px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sal{font-family:var(--px);font-size:12px}
.card.dim{opacity:.45}
.card .flag{position:absolute;inset:auto 0 0 0;background:var(--red);font-family:var(--px);font-size:10px;padding:2px}
.card:has(.flag) .bot{padding-bottom:22px}                          /* keep the flag from covering the last line */
.pc-HN,.pc-PO{background:#5eb4f0}.pc-CT,.pc-WG{background:#58c98a}.pc-DP{background:#e8604f}

.capbar{display:flex;align-items:center;gap:10px;margin-top:10px}
.cap{flex:1;border:3px solid var(--white);border-radius:6px;background:var(--navy);padding:4px 8px}
.cap .t{font-family:var(--px);font-size:11px;text-align:center;margin-bottom:3px}
.cap .track{height:14px;background:#000;border:2px solid #000}
.cap .track i{display:block;height:100%;background:var(--yellow)}

/* --- player page --- */
.pp{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px}
.pp .face{border:3px solid var(--white);border-radius:6px;overflow:hidden;background:var(--gray)}
.pp .face .top{height:120px;display:flex;align-items:flex-end;justify-content:center}
.pp .face img{width:112px;height:112px;image-rendering:pixelated}
.pp .face .bot{padding:6px;border-top:3px solid var(--white);text-align:center}
.rt{display:grid;grid-template-columns:92px minmax(0,1fr) 40px auto;align-items:center;gap:8px;margin-bottom:8px}
.rt .nm{font-family:var(--px);font-size:12px}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.segs i{height:14px;background:var(--navy);border-radius:1px}
.segs i.on{background:var(--yellow)}
.segs i.pot{background:#5a6a9a}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--px);font-size:10px;color:#cfe0ff;text-align:right;padding:4px;font-weight:400}
td{padding:5px 4px;text-align:right;border-top:2px solid rgba(255,255,255,.15)}
th:first-child,td:first-child{text-align:left}
tr.me td{color:var(--yellow)}
tr.cut td{border-top:2px dashed var(--yellow)}
.brk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:min(68vh,430px);padding:6px 8px}
.bcol{display:flex;flex-direction:column;min-width:0}
.bh{font-family:var(--px);font-size:9px;color:#cfe0ff;text-align:center;white-space:nowrap;margin-bottom:3px}
.bms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:3px;min-height:0}
.bpi .bms{justify-content:space-between}
.bm{background:rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.22);border-radius:6px;font-size:13px;line-height:1.2;padding:1px 5px}
.bm div{display:flex;gap:5px;white-space:nowrap;overflow:hidden}
.bm .sd{opacity:.65;min-width:1.3em;text-align:right}
.bm .w{font-weight:700}.bm .l{opacity:.4}.bm .me{color:var(--yellow)}.bm .tbd{opacity:.4}
.bfin .bm{border-color:var(--yellow)}
.bchamp{text-align:center;font-family:var(--px);font-size:11px}
.bcap{font-family:var(--px);font-size:8px;color:#cfe0ff;text-align:center;margin-bottom:2px}

.sheet-bg{position:fixed;inset:0;background:rgba(5,10,30,.6);z-index:40}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;width:min(460px,calc(100% - 32px));max-height:calc(100% - 24px);overflow:auto;border:3px solid var(--white);border-radius:8px;background:var(--blue-d);padding:14px;box-shadow:0 6px 0 var(--navy)}
.sheet .inner{display:grid;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;background:var(--yellow);color:#241a00;font-family:var(--px);font-size:12px;padding:8px 12px;border-radius:4px;border:2px solid #fff;max-width:calc(100% - 32px);text-align:center}
input[type=text]{width:100%;background:var(--navy);border:3px solid var(--white);border-radius:6px;padding:8px;font:16px var(--body);color:#fff}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:4px;border:3px solid transparent;padding:0}
.sw.on{border-color:#fff}

/* --- game --- */
#game{position:fixed;inset:0;background:#0b1433;z-index:30;display:flex;align-items:center;justify-content:center}
#game[hidden]{display:none}
.stage{position:relative}
#court{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.sb{display:flex;align-items:stretch;border:3px solid #fff;border-top:0;border-radius:0 0 10px 10px;background:#0b1433;font-family:var(--px);font-weight:700;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.55)}
.sb .tm{display:flex;align-items:center;gap:8px;padding:4px 10px 5px;min-width:112px;position:relative;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.sb .tm.r{justify-content:flex-end}
.sb .ab{font-size:15px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.sb .sc{font-size:28px;line-height:1;min-width:38px;text-align:center;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.sb .poss{width:8px;height:10px}
.sb .poss.on{background:var(--yellow);clip-path:polygon(0 50%,100% 0,100% 100%)}
.sb .tm.r .poss.on{clip-path:polygon(0 0,100% 50%,0 100%)}
.sb .mid{display:grid;place-items:center;align-content:center;padding:2px 12px;border-inline:3px solid #fff;min-width:78px;background:#0b1433;line-height:1.05}
.sb .q{font-size:9px;color:var(--yellow);letter-spacing:1px;white-space:nowrap}
.sb .rd{font-size:8px;color:#fff;letter-spacing:1px;white-space:nowrap}.sb .rd[hidden]{display:none}
.champ{position:relative;display:grid;justify-items:center;align-content:center;gap:8px;text-align:center;min-height:min(72vh,440px);overflow:hidden}
.champ .cup{font-size:76px;line-height:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.4));animation:cupin .7s cubic-bezier(.2,1.5,.4,1) both}
.champ h2{font-family:var(--px);font-size:30px;margin:0;color:var(--yellow);text-shadow:0 3px 0 #000}
.champ .cf{position:absolute;top:-12px;width:7px;height:11px;animation:cfall linear infinite;pointer-events:none}
.champ > :not(.cf){position:relative;z-index:1}
@keyframes cfall{to{transform:translateY(480px) rotate(540deg)}}
@keyframes cupin{from{transform:scale(.2) rotate(-20deg);opacity:0}}
@media (max-height:500px){.champ{min-height:calc(100vh - 78px);gap:4px}.champ .cup{font-size:54px}.champ h2{font-size:22px}}
.sb .clk{font-size:19px;color:#fff}
.shotbox{margin-top:-1px;border:3px solid #fff;border-top:0;border-radius:0 0 6px 6px;background:#1a0d0d;color:#ff5a3c;font-family:var(--px);font-weight:700;font-size:15px;padding:0 10px 2px;min-width:44px;text-align:center;text-shadow:0 0 6px rgba(255,90,60,.6);box-shadow:0 3px 0 rgba(0,0,0,.5)}
.shotbox:empty{display:none}
.gbtn{position:absolute;top:6px;right:6px;pointer-events:auto}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--px);font-weight:700;font-size:26px;text-shadow:0 3px 0 #000,0 0 14px rgba(0,0,0,.6);text-align:center;pointer-events:none;white-space:nowrap}
.banner small.big{font-size:30px;color:#fff;margin-top:6px}
.banner small{display:block;font-size:13px;color:var(--yellow);margin-top:4px}
/* Shot meter: a slim bar sitting right above the SHOOT button (between it and the basket we attack), so the
   thumb and the eyes are in the same corner. The other team's meter mirrors it bottom-left, by their basket.
   --sb: button size, --sb-r / --sb-b: button's right and bottom offsets, --mw / --mh: meter size. */
:root{--sb:138px;--sb-r:calc(12px + env(safe-area-inset-right) * .7);--sb-l:calc(12px + env(safe-area-inset-left) * .7);--sb-b:calc(12px + env(safe-area-inset-bottom) * .5);--mw:14px;--mh:150px}
.meter{position:absolute;right:calc(var(--sb-r) + (var(--sb) - var(--mw)) / 2);bottom:calc(var(--sb-b) + var(--sb) + 12px);width:var(--mw);height:var(--mh);border:2px solid #fff;border-radius:4px;background:#0b1433;pointer-events:none;box-shadow:0 2px 0 #000;overflow:visible}
.meter i{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:2px}
.meter .pct{position:absolute;right:calc(var(--mw) + 8px);bottom:-3px;font-family:var(--numf);font-weight:700;font-size:12px;text-shadow:0 2px 0 #000;white-space:nowrap}
.meter.right{right:auto;left:calc(var(--sb-l) + (var(--sb) - var(--mw)) / 2)}
.stats[hidden]{display:none}
.stats{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,14,40,.55);z-index:5}
.st-card{border:3px solid #fff;border-radius:8px;background:var(--blue-d);padding:10px 16px 12px;box-shadow:0 5px 0 var(--navy);width:min(430px,92%);display:grid;gap:6px;text-align:center}
.st-title{font-family:var(--px);font-weight:700;font-size:22px;text-shadow:0 3px 0 var(--navy)}
.st-span{font-family:var(--px);font-size:11px;color:var(--yellow);margin-top:-4px}
.st-score{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--px);font-weight:700}
.st-team{border:3px solid #fff;border-radius:5px;padding:2px 8px;font-size:14px}
.st-num{font-size:26px;min-width:40px}
.st-dash{color:#cfe0ff}
.st-table{width:100%;border-collapse:collapse;font-size:15px}
.st-table th{font-family:var(--px);font-size:11px;color:#cfe0ff;text-align:center;font-weight:400;padding:4px 6px;border-top:2px solid rgba(255,255,255,.15)}
.st-table td{padding:4px 6px;border-top:2px solid rgba(255,255,255,.15);font-variant-numeric:tabular-nums;font-family:var(--px);font-size:13px}
.st-table td.u{text-align:left}.st-table td.v{text-align:right}
.st-table .pc{color:#cfe0ff;font-size:11px}
.meter.right .pct{right:auto;left:calc(var(--mw) + 8px)}
.kitp{display:grid;gap:8px;justify-items:center}
.kitp .row{width:100%}

<script>
(() => {
'use strict';

/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;
const uid = () => Math.random().toString(36).slice(2, 9);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
// amounts are in millions; under $1M shows in thousands ($960K)
const money = m => { const a = Math.abs(m), s = m < 0 ? '-' : '';
  if (a === 0) return '$0';
  if (a * 1000 < 9.95) return `${s}$${(a * 1000).toFixed(1).replace(/\.0$/, '')}K`;
  if (Math.round(a * 1000) < 1000) return `${s}$${Math.round(a * 1000)}K`;
  return s + '$' + (a >= 10 ? Math.round(a) : a.toFixed(1).replace(/\.0$/, '')) + 'M'; };

/* ============================ data ============================ */
// every player in the league is made up
const FIRST = ['Marcus','Tyler','Andre','Malik','Darius','Trey','Cole','Evan','Aaron','Caleb','Derek','Elijah','Luke','Mason','Noah','Omar','Quinn','Sam','Terrence','Victor','Xavier','Dante','Miles','Luis','Theo','Rashad','Bryce','Kai','Deshawn','Jamar'];
const LAST = ['Brooks','Ellis','Jenkins','Lewis','Moore','Owens','Stone','Turner','Vance','Banks','Cole','Dixon','Fisher','Gibson','Harper','Knight','Lowe','Newton','Ramsey','Sutton','Tate','Webb','Bishop','Cross','Drake','Foster','Holt','Maxwell','Ruiz','Santos','Warren','Bell','Coleman','Diaz','Graves','Okafor','Mensah','Kowalski','Novak'];
const TONES = { black:'#7a4a2b', tan:'#c68a61', white:'#e8b58f', dark:'#57341f', brown:'#7a4a2b', caramel:'#a06a44', light:'#e0aa82', fair:'#f0c6a2' };
const SKIN = Object.values(TONES);
const HAIR = ['#1b1410','#3a2618','#5c3a1e','#d7b35a'];
const HAIR_BY_TONE = { black:['#1b1410'], tan:['#1b1410','#3a2618'], white:['#1b1410','#3a2618','#5c3a1e','#d7b35a'] };
const STYLES_BY_TONE = { black:['afro','fade','headband'], tan:['afro','fade','headband','curly'], white:['fade','headband','curly'] };
function giveLook(p){
  const tone = pick(['black','black','tan','white','white']);
  p.tone = tone; p.skin = TONES[tone]; p.hair = pick(HAIR_BY_TONE[tone]); p.style = pick(STYLES_BY_TONE[tone]);
  return p;
}
// every team: a main color, a secondary color, and white
const COLORS = [['#d9453b','#1f2a44'],['#2f6fe0','#ffd23f'],['#2f9e5b','#ffd23f'],['#7a4bd1','#ffd23f'],['#f08a24','#1b2233'],['#1f2a44','#e0584b'],['#12a3a3','#1f2a44'],['#b0304f','#ffd23f']];
const SECONDARY = Object.fromEntries(COLORS);
const AI_TEAMS = [['Portside','Pilots'],['Ridgeview','Rams'],['Lakeshore','Lynx'],['Mesa','Vipers'],['Northgate','Wolves'],['Bayview','Herons'],['Summit','Peaks'],['Ironwood','Bears'],['Coral Coast','Sharks'],['Pine Hollow','Owls'],['Redstone','Miners']];
/* Five on the field, one roster spot each (the user's roles):
     HN handler   quarterback / point guard: the best thrower and catcher, stays near or behind the disc, runs the play
     PO popper    plays close to the handler for quick give-and-go passes
     CT cutter    wide receiver: downfield, sprints into open space to gain yards
     WG wing      finds the openings at middle distance along the sidelines
     DP deep      sprints down the field for the long throws */
const POS = ['HN','PO','CT','WG','DP'];
const POS_NAME = { HN:'Handler', PO:'Popper', CT:'Cutter', WG:'Wing', DP:'Deep' };
// The league (user's list): 20 clubs in four divisions of five. [id, city, name, division, main color, second color]
const DIVS = [['E', 'East'], ['C', 'Central'], ['S', 'South'], ['W', 'West']];
const DIV_NAME = Object.fromEntries(DIVS);
const TEAMS = [
  ['ATL','Atlanta','Hustle','S','#4B2E83','#F2C230'], ['ATX','Austin','Sol','S','#F26A21','#1B2A49'], ['CAR','Carolina','Flyers','S','#2E86DE','#F2C230'], ['HOU','Houston','Havoc','S','#D9480F','#000000'], ['DC','DC','Breeze','S','#0B2545','#D7263D'],
  ['CHI','Chicago','Union','C','#5AA9E6','#C8102E'], ['IND','Indianapolis','AlleyCats','C','#0E7A3B','#000000'], ['MAD','Madison','Radicals','C','#E0A800','#000000'], ['MIN','Minnesota','Wind Chill','C','#0C2340','#7FC6E8'], ['PIT','Pittsburgh','Thunderbirds','C','#1B1B1B','#FFB81C'],
  ['BOS','Boston','Glory','E','#0B1F3A','#C8102E'], ['MTL','Montreal','Royal','E','#1D3FA5','#F2F2F4'], ['NY','New York','Empire','E','#151515','#2ECC71'], ['PHI','Philadelphia','Phoenix','E','#C8102E','#000000'], ['TOR','Toronto','Rush','E','#B00020','#F2F2F4'],
  ['OAK','Oakland','Spiders','W','#1A1A1A','#F7D417'], ['SLC','Salt Lake','Shred','W','#1E7F8C','#F2C230'], ['SD','San Diego','Growlers','W','#0A3D62','#F5A623'], ['SEA','Seattle','Cascades','W','#1B4D3E','#8FD3F4'], ['LV','Vegas','Bighorn','W','#5B2A86','#D4AF37'],
].map(([abbr, city, name, conf, c1, c2]) => ({ abbr, city, name, conf, c1, c2 }));   // "conf" holds the division letter
// five ratings, 1-10 (user spec): speed, stamina, throwing (accuracy), catching, strength (how far and how fast he throws)
const RATE = ['spd','sta','thr','cat','str'];
const RATE_NAME = { spd:'Speed', sta:'Stamina', thr:'Throwing', cat:'Catching', str:'Strength' };
const RATE_DESC = { spd:'70 yards in 12 seconds at 1, in 10 seconds at 10.', sta:'Slows down less the more he runs in a point.', thr:'Accuracy: a throw can miss by up to 7.5 yards at 1, 3 at 10.', cat:'Holds on to faster and harder throws, and picks off more.', str:'Longest throw: 35 yards at 1, 70 at 10. Faster throws too.' };
const TILT = {
  HN:{ spd:-1.5, sta:-.5, thr:2, cat:.5, str:-.5 }, PO:{ spd:0, sta:0, thr:1, cat:1, str:-2 },
  CT:{ spd:1.5, sta:.5, thr:-1.5, cat:.5, str:-1 }, WG:{ spd:.5, sta:1, thr:-.5, cat:.5, str:-1.5 }, DP:{ spd:2, sta:-1, thr:-2, cat:1.5, str:-.5 },
};
const SEASON_GAMES = 12;
/* Money (user's model, 2026-10-08; every amount in the code is in millions, so .025 is $25K). A small club:
     ARENA           bleachers of 500 / 750 / 1,250 / 2,000 seats
     TICKETS         $20 to $150. At $150 the share of seats sold equals your fans %; every dollar under that sells
                     another 0.27% of the seats (15% fans: 15% full at $150, half full at $20; 100% fans sells out at $150)
     FOOD + PARKING  each fan at a home game spends $15 / 20 / 25 / 40 on food and $10 / 15 / 25 / 50 on parking
     SPONSORING      sponsors pay $25 / 40 / 65 / 90 for every fan in the building, at home AND away
     MARKETING       wins bring more fans, losses cost fewer
   There is no TV money. Four levels of each, so three upgrades, priced so a good first three seasons (or a slower
   five) pays for all of them. */
const SEATS = [500, 750, 1250, 2000], FOOD = [15, 20, 25, 40], PARK = [10, 15, 25, 50], SPONSOR = [25, 40, 65, 90];
const lvOf = (k, lv) => clamp(lv ?? G.fac[k] ?? 1, 1, 4) - 1;
const seats = lv => SEATS[lvOf('arena', lv)];
const foodPer = lv => FOOD[lvOf('amenities', lv)], parkPer = lv => PARK[lvOf('amenities', lv)];
const fanSpend = lv => foodPer(lv) + parkPer(lv);                       // food + parking per fan: 25 / 35 / 50 / 90
const sponsorPer = lv => SPONSOR[lvOf('sponsor', lv)];
const MKT_WIN = .15, MKT_LOSS = .1;                                    // per Marketing level above 1: wins +15% fans, losses -10%
const ASK_LO = .85, ASK_HI = 1.15;                                     // each player asks 85-115% of the going rate for his stars
const DRAFT_ERR = 1;                                                   // draft ratings are shown within ±1 (scouting is gone)
// short: what the next upgrade changes, "now → next" (just the current value once it's maxed); shown on every card
const step = (lv, f) => lv < FAC_MAX ? f(lv) + ' → ' + f(lv + 1) : f(lv);
const FAC = {
  arena:{ name:'Arena', short:lv => step(lv, v => seats(v).toLocaleString()) + ' seats', desc:lv => 'Bleacher seats. More seats only help once you can fill them.' },
  amenities:{ name:'Food + Parking', short:lv => step(lv, v => '$' + fanSpend(v)) + ' a fan', desc:lv => `What each fan spends at a home game: $${foodPer(lv)} on food and $${parkPer(lv)} on parking now.` },
  marketing:{ name:'Marketing', short:lv => step(lv, v => '+' + Math.round((v - 1) * MKT_WIN * 100) + '%') + ' per win', desc:lv => `Wins bring more fans and losses cost fewer (${Math.round((lv - 1) * MKT_LOSS * 100)}% fewer now, 10% more each level).` },
  sponsor:{ name:'Sponsoring', short:lv => step(lv, v => '$' + sponsorPer(v)) + ' a fan', desc:lv => 'Sponsors pay this for every fan in the building, at your games and on the road.' },
};
// what each upgrade costs, $M: three upgrades each (levels 1-4). All twelve come to about $1.4M (Arena, Marketing and Sponsoring are the user's prices); the aim (user) is to
// have everything at level 4 around a good manager's third season, or a struggling one's fifth.
const FAC_PRICE = {
  arena:[.075, .125, .2],                                             // the user's prices
  amenities:[.025, .08, .28],
  marketing:[.015, .06, .125],
  sponsor:[.03, .125, .25],
};
const FAC_MAX = 4;
const facCost = (k, lv = G.fac[k]) => FAC_PRICE[k][lv - 1];

/* ============================ players ============================ */
const pAvg = p => RATE.reduce((s, k) => s + p[k], 0) / RATE.length;
// Stars from the average rating, read as a total out of 40 (average x 4): every 4 points is half a star.
// 36-40 is 5 stars, 32-35 is 4.5 ... 12-15 is 2, 9-11 is 1.5, 8 and under is 1.
const starsFromTotal = t => t <= 8 ? 1 : Math.min(5, 1.5 + .5 * Math.floor((t - 8) / 4));
const pStars = p => starsFromTotal(Math.round(pAvg(p) * 4));
// the average rating that lands in the middle of a star band (1 star aims at 7 of its 8, so a little randomness stays under 9)
const starsTarget = st => (st >= 1.5 ? 10 + (st - 1.5) * 8 : st >= 1 ? 7 : 5) / 4;
// a smooth star value, for pricing: matches the bands above
const starsSmooth = p => { const t = pAvg(p) * 4; return t <= 8 ? t / 8 : 1.5 + (t - 10) / 8; };
function starsHTML(s){
  const full = Math.floor(s), half = s - full >= .5;
  let h = '';
  // a half star is a grey star with its left half painted gold (the "half star" symbol shows as a box on iPhone)
  for (let i = 0; i < 5; i++) h += i < full ? '★' : (i === full && half ? '<span class="half">★</span>' : '<span class="off">★</span>');
  return `<span class="stars">${h}</span>`;
}
function makePlayer(pos, target, age = ri(20, 32)){
  const p = giveLook({ id:uid(), fn:pick(FIRST), ln:pick(LAST), pos, age, num:ri(0, 55), gp:0, pts:0, sal:0, yrs:0 });
  for (const k of RATE) p[k] = clamp(Math.round(target + TILT[pos][k] + rnd(-1.3, 1.3)), 1, 10);
  const d = Math.round((target - pAvg(p)) * RATE.length);
  for (let i = 0; i < Math.abs(d); i++) { const k = pick(RATE); p[k] = clamp(p[k] + Math.sign(d), 1, 10); }
  const room = age <= 21 ? rnd(1.5, 4) : age <= 24 ? rnd(.5, 2.5) : age <= 27 ? rnd(0, 1) : 0;
  p.pot = Math.min(10, Math.round((pAvg(p) + room) * 2) / 2);
  return p;
}

/* The schedule, 12 games in 14 weeks (user): every team plays its four division rivals home and away (8 games), then four

  for (let pass = 0; pass < 2; pass++) for (let r = 0; r < 5; r++) {               // division games: five rounds a pass, one club off each round
    const games = [];
    for (const [c] of DIVS) {

      for (let i = 0; i < 3; i++) { const a = arr[i], b = arr[5 - i]; if (a && b) games.push((pass + i) % 2 ? { h:a, a:b } : { h:b, a:a }); }

/* One simulated possession: a string of throws that either all connect (a goal) or one doesn't (a turnover).
   Each throw is completed about 80% of the time, more with good throwers and catchers, less against a fast
   defense with good hands. A strong-armed team needs fewer throws to get there. */

function simPossession(off, def){
  const P = lastPoss = { cmp:0, to:false, d:false, goal:false };
  const pc = clamp(.80 + (off.thr - 5) * .012 + (off.cat - 5) * .012 - (def.spd - off.spd) * .012 - (def.cat - 5) * .006, .55, .95);
  const n = clamp(ri(3, 7) - Math.round((off.str - 5) / 3), 2, 8);
  for (let i = 0; i < n; i++) {
    if (Math.random() > pc) { P.to = true; P.d = Math.random() < .35; return 0; }
    P.cmp++;
  }
  P.goal = true;

}
const teamPlayers = t => t.user ? rosterArr() : (t.players || []);

const CATCH_W = { HN:.8, PO:1.2, CT:1.6, WG:1.4, DP:1.8 };                        // who gets thrown to
const GOAL_W = { HN:.3, PO:.6, CT:1.4, WG:1.4, DP:2.6 };                          // who catches the goals
const thrower = pl => wPick(pl, p => THROW_W[p.pos] * (.5 + p.thr / 10));

function creditPoss(off, def){
  const P = lastPoss; if (!P || !off.pl.length) return;
  for (let i = 0; i < P.cmp; i++) {
    const t = thrower(off.pl), last = P.goal && i === P.cmp - 1;
    const r = wPick(off.pl.filter(p => p !== t), p => (last ? GOAL_W : CATCH_W)[p.pos] * (.5 + p.cat / 10));
    const rb = pbFor(off.pb, r); rb.tgt++; rb.rec++;
    if (last) { pbFor(off.pb, t).ast++; off.box[r.id] = (off.box[r.id] || 0) + 1; }
  }

    const t = thrower(off.pl);

    if (P.d) { pbFor(off.pb, t).to++; if (def && def.pl.length) pbFor(def.pb, wPick(def.pl, p => p.spd + p.cat)).d++; }
  }
}

// play out the current round (our game uses userWinner), then set up the next one
function playoffRound(userWinner){
  const P = G.playoffs;

  const w = P.games.map(([h, a]) => (userWinner && (h === 'U' || a === 'U')) ? userWinner : sim(h, a));
  const l = P.games.map(([h, a], i) => w[i] === h ? a : h);

    P.champ = w[0]; P.round++; P.userOut = P.out.includes('U');
    if (P.champ === 'U') G.credits += 10;

  if (P.round === 0) P.games = P.div.map((d, i) => [d[0], w[i]]);

const portraitCache = {};
function portrait(p, c1){
  const key = [p.id, c1, p.style, p.skin, p.hair, p.band, p.face].join('|');
  if (portraitCache[key]) return portraitCache[key];
  const S = 20, cv = document.createElement('canvas'); cv.width = cv.height = S;

  const O = '#1a1426', sh = shade(p.skin, -.16), hi = shade(p.skin, .12), H = p.hair;
  const st = p.style === 'headband' ? 'bald' : p.style, band = p.band || p.style === 'headband', face = p.face || '';
  f(2, 15, 16, 5, O); f(3, 16, 14, 4, c1); f(8, 16, 4, 1, '#ffffff');        // shoulders + jersey
  f(8, 13, 4, 3, O); f(9, 13, 2, 3, p.skin);                                // neck
  if (st === 'long') { f(4, 2, 12, 11, O); f(5, 3, 10, 9, H); }             // hair behind the head, down past the ears
  f(5, 3, 10, 11, O); f(6, 4, 8, 9, p.skin); f(5, 7, 1, 3, p.skin); f(14, 7, 1, 3, p.skin);

  if (st === 'fade') { f(6, 3, 8, 2, H); f(6, 5, 1, 2, sh); f(13, 5, 1, 2, sh); }
  if (st === 'afro') { f(4, 1, 12, 5, O); f(5, 1, 10, 5, H); f(4, 5, 2, 3, H); f(14, 5, 2, 3, H); }
  if (st === 'curly') { f(5, 2, 10, 4, O); f(6, 2, 8, 3, H); [6, 8, 10, 12].forEach(x => f(x, 1, 1, 1, H)); f(5, 5, 1, 2, H); f(14, 5, 1, 2, H); }
  if (st === 'long') { f(5, 2, 10, 3, O); f(6, 2, 8, 3, H); f(6, 5, 3, 1, H); f(5, 4, 1, 8, H); f(14, 4, 1, 8, H); }
  if (st === 'cornrows') { f(5, 2, 10, 3, O); f(6, 3, 8, 2, H); [7, 9, 11].forEach(x => f(x, 3, 1, 2, sh)); f(6, 5, 1, 1, H); f(13, 5, 1, 1, H); }
  if (st === 'hitop') { f(5, 0, 10, 5, O); f(6, 0, 8, 5, H); f(6, 5, 1, 1, sh); f(13, 5, 1, 1, sh); }
  if (band) { f(5, 5, 10, 1, O); f(6, 5, 8, 1, '#ffffff'); }
  f(7, 8, 2, 1, '#ffffff'); f(11, 8, 2, 1, '#ffffff'); f(8, 8, 1, 1, O); f(12, 8, 1, 1, O);
  f(7, 7, 2, 1, O); f(11, 7, 2, 1, O);
  if (face.includes('unibrow')) f(9, 7, 2, 1, O);
  f(9, 10, 2, 1, 'rgba(0,0,0,.25)');
  if (face.includes('beard')) { f(6, 9, 1, 3, H); f(13, 9, 1, 3, H); f(6, 11, 8, 2, H); f(7, 12, 6, 1, H); }
  if (face.includes('goatee')) { f(8, 12, 4, 1, H); f(8, 10, 4, 1, H); }
  if (face.includes('stache')) f(8, 10, 4, 1, H);
  f(8, 11, 4, 1, '#8a3b2e');                                                 // mouth, on top of any beard
  if (face.includes('goggles')) { f(5, 7, 10, 1, O); f(6, 7, 3, 2, O); f(11, 7, 3, 2, O); f(7, 7, 2, 1, '#bfe3ff'); f(11, 7, 2, 1, '#bfe3ff'); f(7, 8, 1, 1, '#bfe3ff'); f(12, 8, 1, 1, '#bfe3ff'); }
  return portraitCache[key] = cv.toDataURL();
}

/* ---- money outlook: an estimate of what a home game and an away game leave after paying the players ---- */
function gateAt(fansPct, ticket = G.ticket, level){
  return seats(level) * attAt(fansPct, ticket) * (ticket + fanSpend() + sponsorPer()) / 1e6;

function moneyOutlook(){
  const payGame = payroll() / PAY_GAMES, others = G.league.filter(t => !t.user);
  const home = gateAt(G.fans) - payGame, away = avg(others.map(t => awayCrowd(t).total)) - payGame;
  return { home, away, season:SEASON_GAMES / 2 * (home + away) };
}

function aiDraft(){
  const O = G.off;
  const n = Math.min(O.prospects.length, ri(3, 5));
  for (let i = 0; i < n; i++) { const best = [...O.prospects].sort((a, b) => b.pot - a.pot)[ri(0, 1)] || O.prospects[0]; O.prospects = O.prospects.filter(x => x !== best); }
  while (O.prospects.length < 10) { const pos = pick(POS); const p = makePlayer(pos, rnd(2.5, 5), ri(19, 22)); p.pot = Math.min(10, Math.round((pAvg(p) + rnd(1, 4)) * 2) / 2); p.sal = halfPay(p); p.yrs = 3; p.scout = RATE.reduce((o, k) => (o[k] = clamp(p[k] + ri(-1, 1) * DRAFT_ERR, 1, 10), o), {}); O.prospects.push(p); }
}

    const open = Math.min(...foes.map((f, k) => k === 0 ? 99 : dist(f, P)));   // everyone but the mark
    const gain = (P.x - e.x) * d;
    const sc = gain * .22 + Math.min(open, 8) * 2.4 - Math.max(0, D - 22) * .5 + rnd(0, 6) + (inGoal(P, side) ? 5 : 0);   // cautious: he takes the open man over the big gain, so it takes him more throws to score
    all.push({ sc, P, open, D }); if (!best || sc > best.sc) best = all[all.length - 1];
  });
  if (!best) { M.think = .3; return; }
  if (best.open < 2.4 && M.stall < 7 && Math.random() > AI_FORCE) { M.think = rnd(.35, .7); return; }
  if (Math.random() < AI_BAD_READ * wild) best = pick(all);          // the wrong read
  const off = Math.random() * AI_MISS(best.D) * wild, ang = Math.random() * Math.PI * 2;   // and a hand that isn't perfectly steady
  throwDisc(side, e, { x:best.P.x + Math.cos(ang) * off, y:best.P.y + Math.sin(ang) * off });
}

/* ---- the loop ---- */
function update(dt){
  if (!M || paused) return;
  M.flash = Math.max(0, M.flash - dt); if (M.shake > 0) M.shake -= dt; if (M.pop > 0) M.pop -= dt;
  for (const e of [...M.our, ...M.th]) { if (e.poseT > 0) e.poseT -= dt; if (e.dive > 0) e.dive -= dt; if (e.z > 0) e.z = Math.max(0, e.z - dt * 3); }
  const play = ['live', 'air', 'loose', 'pull'].includes(M.phase);
  if (play) M.st[M.off].poss += dt;
  if (M.phase === 'score') {
    M.scoreT -= dt;
    if (M.scoreT <= 0) afterGoal();
  } else if (play) {
    if (M.phase === 'live') {
      M.stall += dt;
      if (M.stall >= STALL) { const h = holderEnt(); M.st[M.off].to++; turnover({ x:h.x, y:h.y }, otherSide(M.off), 'STALLED'); }
      else if (M.off === 'them' || M.auto) aiThrow(M.off, dt);
    }
    if (M && play) { updateOffense(M.off, dt); updateDefense(otherSide(M.off), dt); }
    updateDisc(dt);
  }
  if (M) hud();
}
/* After a goal: the game ends when someone reaches the target. A game to 5 has a halftime when the first team gets to 3,
   and the team that pulled to start the game receives to start the second half; games to 3 or 4 are too short for one.
   Otherwise the team that just scored pulls to the other. */
function afterGoal(){
  if (M.phase === 'break' || M.phase === 'done') return;
  const final = Math.max(M.us, M.them) >= M.to, half = !final && !M.half && M.to >= 5 && Math.max(M.us, M.them) >= Math.ceil(M.to / 2);
  if (!final && !half) { startPull(otherSide(M.lastGoal)); return; }
  if (half) M.half = true;
  M.phase = final ? 'done' : 'break'; M.aim = null; M.disc.fl = null; hud();
  showStats(final ? 'FINAL' : 'HALFTIME', final ? 'Full game' : '1st half', final ? 'Finish' : '2nd half', () => {
    if (final) { finishLive(M.id); return; }
    startPull(otherSide(M.first)); hud();
  });
}
function showStats(title, span, cta, onGo){
  const U = M.st.us, T = M.st.them, t = M.t, o = M.opp;
  const frac = (m, a) => `${m}/${a} <span class="pc">(${a ? Math.round(m / a * 100) : 0}%)</span>`;
  const time = sec => `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, '0')}`;
  const rows = [
    ['Completions', frac(U.cmp, U.att), frac(T.cmp, T.att)],
    ['Dropped', U.drop || 0, T.drop || 0],
    ['Missed throws', U.miss || 0, T.miss || 0],
    ['Picked off', T.d, U.d],
    ['Stalled', U.stall || 0, T.stall || 0],
    ['Possession', time(U.poss), time(T.poss)],
  ];
  const el = $('#stats');
  el.innerHTML = `<div class="st-card">
    <div class="st-title">${title}</div><div class="st-span">${span}</div>
    <div class="st-score">
      <div class="st-team" style="background:${t.c1};color:${t.c2}">${esc(t.abbr)}</div><div class="st-num">${M.us}</div>
      <div class="st-dash">–</div>
      <div class="st-num">${M.them}</div><div class="st-team" style="background:${o.c1};color:${o.c2}">${esc(o.abbr)}</div>
    </div>
    <table class="st-table">${rows.map(([k, u, v]) => `<tr><td class="u">${u}</td><th>${k}</th><td class="v">${v}</td></tr>`).join('')}</table>
    <button class="btn go" id="stGo">${cta}</button></div>`;
  el.hidden = false;
  $('#stGo').onclick = () => { el.hidden = true; onGo(); };
}
function finishLive(id){
  if (!M || M.id !== id) return;
  const done = M; M = null;
  cancelAnimationFrame(raf); closeSheet();
  $('#game').hidden = true; $('#ui').hidden = false;
  const opp = teamById(done.opp.id); if (opp) fakeBox(teamPlayers(opp), done.them, done.st.them, done.st.us);
  endMatch(done, done.us, done.them, done.box, done.pbox);
}
function simRest(){
  if (!M) return;
  const U = userRatings(), O = teamR(M.opp);
  let ours = M.off === 'us';                                          // trade possessions from here until someone gets to the target
  while (M.us < M.to && M.them < M.to) { if (ours) { M.us += simPossession(U, O); simCredit(M.box, M.pbox); } else M.them += simPossession(O, U); ours = !ours; }
  finishLive(M.id);
}

/* ---- input ----
   Offense: press anywhere, drag back like a slingshot and let go. The throw goes the opposite way on the screen, and
   the farther you pull the farther it goes (AIM_GAIN screen pixels of throw for each pixel of drag), up to the
   thrower's longest throw. The dotted arc and ring show where you're aiming and how far off it could land.
   There is nothing to do on defense: your team plays its zone on its own. */
const AIM_GAIN = 3, AIM_MIN = 9;                                      // 3: the longest throw in the game (70 yd) is a drag of about 150 px, most of the way from the thrower to the edge of the screen (it was 5: far too twitchy on a phone)
function canvasPt(ev){ const r = cv.getBoundingClientRect(); return { x:(ev.clientX - r.left) / r.width * CW, y:(ev.clientY - r.top) / r.height * CH }; }
function aimTarget(){
  const A = M.aim, h = holderEnt(); if (!A || !h) return null;
  const dx = A.cx - A.x0, dy = A.cy - A.y0, len = Math.hypot(dx, dy);
  if (len < AIM_MIN) return null;
  let wx = -dx * AIM_GAIN / PXF, wy = -dy * AIM_GAIN / PYF;           // opposite the drag, in yards
  const D = Math.hypot(wx, wy), R = maxRange(h.p), k = D > R ? R / D : 1;
  wx *= k; wy *= k;
  return { x:h.x + wx, y:h.y + wy, D:Math.min(D, R), max:D >= R };   // exactly where you aim: no aim help (the user had it taken out)
}
cv.addEventListener('pointerdown', ev => {
  if (!M || paused) return;
  const pt = canvasPt(ev);
  if (M.off === 'us' && !M.auto && M.phase === 'live' && holderEnt()) {
    ev.preventDefault(); try { cv.setPointerCapture(ev.pointerId); } catch {}
    M.aim = { x0:pt.x, y0:pt.y, cx:pt.x, cy:pt.y, id:ev.pointerId };
  }
});
cv.addEventListener('pointermove', ev => { if (M && M.aim && ev.pointerId === M.aim.id) { const pt = canvasPt(ev); M.aim.cx = pt.x; M.aim.cy = pt.y; } });
const aimUp = ev => {
  if (!M || !M.aim || ev.pointerId !== M.aim.id) return;
  const T = ev.type === 'pointercancel' ? null : aimTarget(), h = holderEnt();
  M.aim = null;
  if (T && h && !h.slide && M.phase === 'live' && M.off === 'us' && !paused) throwDisc('us', h, T, { user:true });
};
cv.addEventListener('pointerup', aimUp); cv.addEventListener('pointercancel', aimUp);
$('#pauseBtn').addEventListener('click', () => { if (!M) return; paused = true; M.aim = null; speedSheet(true); });

/* ---- draw ---- */
function drawAim(){
  const T = aimTarget(), h = holderEnt(); if (!T || !h) return;
  const hh = clamp(T.D * .06 - .3, 0, 4.6), n = Math.max(4, Math.round(T.D / 3.5));
  for (let i = 1; i < n; i++) {                                        // the flight: a dotted arc, and its line along the grass
    const u = i / n, x = lerp(h.x, T.x, u), y = lerp(h.y, T.y, u), z = 1.3 + 4 * hh * u * (1 - u);
    ctx.fillStyle = 'rgba(10,50,20,.35)'; ctx.fillRect(Math.round(sx(x)), Math.round(sy(y)), 2, 1);
    ctx.fillStyle = T.max ? '#ffd23f' : '#ffffff'; ctx.fillRect(Math.round(sx(x)), Math.round(sy(y, z)), 2, 2);
  }
  // where it's aimed, and the ring it could land anywhere inside
  const X = Math.round(sx(T.x)), Y = Math.round(sy(T.y)), er = errAt(h.p, T.D);
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 22) ctx.fillRect(Math.round(X + Math.cos(a) * er * PXF), Math.round(Y + Math.sin(a) * er * PYF), 1, 1);
  ctx.fillStyle = '#1b2440'; ctx.fillRect(X - 4, Y - 1, 9, 3); ctx.fillRect(X - 1, Y - 4, 3, 9);
  ctx.fillStyle = T.max ? '#ffd23f' : '#ffffff'; ctx.fillRect(X - 3, Y, 7, 1); ctx.fillRect(X, Y - 3, 1, 7);
}
function draw(){
  if (!M) return;
  const D = M.disc, T = aimTarget(), h = holderEnt(), F = D.fl;
  let VW, VH;
  if (M.aim && h) {
    /* Aiming: the thrower is pinned to the spot on the screen where he was when the drag began, and the view zooms out
       around him just far enough to show where the throw would land. Nothing slides under the finger, so pulling back
       always means farther and easing off always means shorter. */
    const A = M.aim;
    if (A.px == null) { A.px = (X0 + h.x * PXF - cam) * zoom; A.py = (Y0 + h.y * PYF - camY) * zoom; }
    let want = ZOOM;
    if (T) {
      const dx = (T.x - h.x) * PXF, dy = (T.y - h.y) * PYF, m = 24;   // the landing spot stays this far inside the edge
      if (dx > 1) want = Math.min(want, Math.max(40, CW - m - A.px) / dx); else if (dx < -1) want = Math.min(want, Math.max(40, A.px - m) / -dx);
      if (dy > 1) want = Math.min(want, Math.max(30, CH - m - A.py) / dy); else if (dy < -1) want = Math.min(want, Math.max(30, A.py - m - 22) / -dy);   // 22: the scoreboard
    }
    want = clamp(want, ZOOM_AIM, ZOOM);
    zoom = lerp(zoom, want, want < zoom ? .2 : .1);
    if (Math.abs(zoom - want) < .002) zoom = want;
    VW = CW / zoom; VH = CH / zoom;
    cam = X0 + h.x * PXF - A.px / zoom; camY = Y0 + h.y * PYF - A.py / zoom;
  } else {
    // otherwise: follow the disc, and while it's in the air keep it and where it's coming down both on screen
    const b = F ? F.land : null;
    let want = ZOOM;
    if (b) {
      const spanX = Math.abs(b.x - D.x) * PXF + 70, spanY = Math.abs(b.y - D.y) * PYF + 56;   // with room around both ends
      want = clamp(Math.min(ZOOM, CW / spanX, CH / spanY), ZOOM_OUT, ZOOM);
    }
    zoom = lerp(zoom, want, want < zoom ? .14 : .06);                  // out quickly, back in gently
    if (Math.abs(zoom - want) < .002) zoom = want;
    VW = CW / zoom; VH = CH / zoom;
    const fx = b ? (D.x + b.x) / 2 : D.x + (h ? dirOf(M.off) * 4 : 0), fy = b ? (D.y + b.y) / 2 : D.y;
    const tx = VW >= WORLD_W ? (WORLD_W - VW) / 2 : clamp(X0 + fx * PXF - VW / 2, 0, WORLD_W - VW);
    const ty = VH >= CH ? (CH - VH) / 2 : clamp(Y0 + fy * PYF - 10 - VH * .58, 0, CH - VH);   // a little low of center, so the scoreboard covers less of the play
    cam = lerp(cam, tx, .12); camY = lerp(camY, ty, .12);
    cam = Math.round(cam * 100) / 100; camY = Math.round(camY * 100) / 100;
  }
  ctx.setTransform(SS * zoom, 0, 0, SS * zoom, 0, 0); ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#16204a'; ctx.fillRect(0, 0, VW, VH); ctx.fillStyle = '#2f7d3a'; ctx.fillRect(0, Y0 - camY, VW, VH);   // beyond the stands and past the grass when pulled right back
  if (M.shake > 0) { const k = M.shake / .2; ctx.translate(Math.round((Math.random() - .5) * 3 * k), Math.round((Math.random() - .5) * 2 * k)); }
  ctx.drawImage(courtCv, 0, 0, WORLD_W, CH, -cam, -camY, WORLD_W, CH);
  if (M.pop > 0) for (let i = 0; i < 5; i++) { const px = Math.floor(Math.random() * VW), py = 3 + Math.floor(Math.random() * Math.max(4, Y0 - 22 - camY)); ctx.fillStyle = '#ffffff'; ctx.fillRect(px, py - 1, 1, 3); ctx.fillRect(px - 1, py, 3, 1); }
  const play = ['live', 'air', 'loose', 'pull'].includes(M.phase);
  const ents = [
    ...M.our.map((e, i) => ({ y:e.y, f:() => drawPlayer(e, M.uni.us, play && !M.auto && M.off === 'us' && h === e ? '#ffd23f' : null) })),
    ...M.th.map(e => ({ y:e.y, f:() => drawPlayer(e, M.uni.them, null) })),
    { y:-2, f:() => { drawBench('us'); drawBench('them'); } },
    { y:D.y + (h ? .1 : 0), f:drawDisc },
  ].sort((a, b) => a.y - b.y);
  ents.forEach(x => x.f());
  drawAim();
}
function loop(now){
  const dt = clamp((now - lastT) / 1000, 0, .05); lastT = now;
  update(dt); draw();
  if (M) raf = requestAnimationFrame(loop);
}

/* ============================ boot ============================ */
// the old single save moves into slot 1 (once), then the game opens on the save-slot screen
try {
  const old = localStorage.getItem(CACHE);
  if (old) { if (!localStorage.getItem(slotKey(1))) localStorage.setItem(slotKey(1), old); localStorage.setItem(CACHE + '.migrated', old); localStorage.removeItem(CACHE); }
} catch {}
screen = 'slots'; render();
(async () => {
  const use = window.claude?.use; if (!use) return;
  DB = await use('db').catch(() => null); if (!DB) return;
  try {
    for (let n = 1; n <= SLOTS; n++) {
      const snap = await DB.doc('saves/slot' + n).get();
      if (snap.exists && snap.data().json) slotRemote[n] = snap.data().json;
    }
    if (!slotRaw(1)) {                                                // the old database save becomes slot 1
      const main = await DB.doc('saves/main').get();
      if (main.exists && main.data().json) {
        const j = main.data().json, r = JSON.parse(j);
        if (r && r.v >= 2) { slotRemote[1] = j; await DB.doc('saves/slot1').set({ json:j, at:Date.now() }); await DB.doc('saves/main').set({ json:'', moved:'slot1', at:Date.now() }); }   // moved, so a reset stays reset
      }
    }
    if (!M && SLOT === null) render();
  } catch (e) { console.warn(e); }
})();
})();
</script>
